name: task_manager
description: "Task Manager — a full Flutter app wired to the Task Manager New REST API (auth, profile, task CRUD, status tracking)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#335340"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter_native_splash:
  color: "#335340"
  image: assets/images/app_icon.png
  android_12:
    image: assets/images/app_icon.png
    icon_background_color: "#335340"
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
